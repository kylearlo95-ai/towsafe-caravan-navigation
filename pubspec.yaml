name: towsafe
description: "A Flutter navigation app built for caravans and motorhomes. Smart routing that avoids bridges, weight restrictions, and narrow roads."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.2

  # Geolocation & Maps
  geolocator: ^9.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Networking
  http: ^1.1.0

  # Local Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.3

  # Navigation & Routing
  go_router: ^12.0.0

  # Voice & Text-to-Speech
  flutter_tts: ^0.14.0

  # Date/Time
  intl: ^0.19.0

  # State Management (optional, but recommended for later)
  provider: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets placeholder
  # assets:
  #   - assets/images/
  #   - assets/data/
